<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4ED" />
    <title>غير متصل — TeacherHub</title>
    <style>
      :root { color-scheme: light dark; font-family: "Segoe UI", Tahoma, sans-serif; background: #f7f4ed; color: #121a33; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 28rem; text-align: center; padding: 2rem; border: 1px solid #e8e2d5; border-radius: 1rem; background: #fff; }
      h1 { font-size: 1.5rem; } p { line-height: 1.8; color: #444b64; }
      button { min-height: 44px; border: 0; border-radius: .75rem; padding: .65rem 1rem; background: #2350d8; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      @media (prefers-color-scheme: dark) { :root { background: #0b1020; color: #e8ecf6; } main { background: #131a2e; border-color: #243049; } p { color: #bbc3d8; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>هذه الصفحة لا تحتوي على بيانات محفوظة للحساب. أعد الاتصال بالإنترنت ثم حاول فتح TeacherHub مرة أخرى.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
