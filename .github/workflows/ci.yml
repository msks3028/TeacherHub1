name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — install, generate Prisma client, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # A throwaway secret + a local SQLite-less placeholder DB URL, only
      # used so `prisma generate` and the (mocked-DB) test suite can run in
      # CI without a real database. Never a real connection string.
      JWT_SECRET: "ci-only-placeholder-secret-not-used-in-production-0000000000"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend — install, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build
        run: npm run build
